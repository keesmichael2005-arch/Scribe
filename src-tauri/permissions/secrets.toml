[[permission]]
identifier = "set-api-key-cmd"
description = "Allows the onboarding window to set a provider API key."
commands.allow = ["set_api_key_cmd"]

[[permission]]
identifier = "delete-api-key-cmd"
description = "Allows the onboarding window to delete a provider API key."
commands.allow = ["delete_api_key_cmd"]

[[permission]]
identifier = "has-api-key-cmd"
description = "Allows the onboarding window to check whether a provider API key exists."
commands.allow = ["has_api_key_cmd"]
