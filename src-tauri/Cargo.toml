[package]
name = "scribe"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "scribe_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
keyring = "4.0"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-io-kit = "0.3"
