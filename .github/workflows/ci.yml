# TEMPORARY hand-written stopgap — NOT generated by OHQ's src/ci-template.ts.
# Scribe Sprint 0 is a de-risk spike: the app lives in spike/ (Tauri 2 + TS) and
# has no automated tests yet. The OHQ-generated workflow assumed a root-level npm
# project with a `test` script and broke immediately ("lock file not found").
# Until the real app moves to the repo root and grows a test suite, this just proves
# the spike frontend still bundles. `tsc` is skipped (the spike has no tsconfig.json);
# `vite build` is enough of a compile signal for a spike gate.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spike/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend (vite)
        run: npx vite build
